<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Sun circle -->
  <circle cx="16" cy="16" r="10" fill="#F59E0B"/>
  <!-- Sun rays -->
  <g fill="#F59E0B">
    <rect x="15" y="1" width="2" height="5" rx="1"/>
    <rect x="15" y="26" width="2" height="5" rx="1"/>
    <rect x="1" y="15" width="5" height="2" rx="1"/>
    <rect x="26" y="15" width="5" height="2" rx="1"/>
    <rect x="5.1" y="5.1" width="2" height="5" rx="1" transform="rotate(45 6.1 7.6)"/>
    <rect x="24.9" y="21.9" width="2" height="5" rx="1" transform="rotate(45 25.9 24.4)"/>
    <rect x="5.1" y="21.9" width="2" height="5" rx="1" transform="rotate(-45 6.1 24.4)"/>
    <rect x="24.9" y="5.1" width="2" height="5" rx="1" transform="rotate(-45 25.9 7.6)"/>
  </g>
  <!-- Solar panel overlay -->
  <rect x="11" y="11" width="10" height="10" fill="#1E40AF" rx="1"/>
  <line x1="11" y1="14.3" x2="21" y2="14.3" stroke="#3B82F6" stroke-width="0.5"/>
  <line x1="11" y1="17.6" x2="21" y2="17.6" stroke="#3B82F6" stroke-width="0.5"/>
  <line x1="14.3" y1="11" x2="14.3" y2="21" stroke="#3B82F6" stroke-width="0.5"/>
  <line x1="17.6" y1="11" x2="17.6" y2="21" stroke="#3B82F6" stroke-width="0.5"/>
</svg>
